{% macro badge(status) -%}
<span class="badge badge-{{ status }}">{{ STATUS_LABELS.get(status, status) }}</span>
{%- endmacro %}
{% macro money(v) -%}{% if v is none or v == '' %}<span class="muted">—</span>{% else %}₹{{ "{:,.2f}".format(v|float) }}{% endif %}{%- endmacro %}
{% macro csrf_field() -%}<input type="hidden" name="csrf" value="{{ csrf }}">{%- endmacro %}
